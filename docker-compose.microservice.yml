version: '3.8'

# ============================================================================
# CLUTCH ARCHITECTURE A: DECOUPLED RUNNER MICROSERVICE PRODUCTION STACK
#
# Threat Model & Security Posture:
# - ZERO Docker daemon socket mounts on public API (clutch-api).
# - Dedicated runner microservice orchestrates per-submission ephemeral sandboxes.
# - clutch-internal network is strictly private (internal: true) with NO internet access.
# - Public API has NO directly published ports; ingress is strictly via reverse proxy.
# - Fail-closed: Docker Compose aborts if any production credential is unset or empty.
# - Constant-time RFC 6750 Bearer token authentication between API and runner.
# ============================================================================

networks:
  clutch-frontend:
    driver: bridge
  clutch-internal:
    driver: bridge
    internal: true # Genuinely private: zero external inbound or outbound internet access

services:
  # ============================================================================
  # 1. Authoritative PostgreSQL Database (Isolated on Internal Network)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: clutch-postgres
    restart: unless-stopped
    networks:
      - clutch-internal
    environment:
      POSTGRES_DB: clutch_db
      POSTGRES_USER: clutch_admin
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be explicitly set and non-empty in production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/storage/schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clutch_admin -d clutch_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Dedicated Isolated Runner Microservice (Internal Network Only)
  # Orchestrates per-submission short-lived container sandboxes
  # ============================================================================
  clutch-runner-service:
    build:
      context: .
      dockerfile: server/Dockerfile.runner-service
    container_name: clutch-runner-service
    restart: unless-stopped
    networks:
      - clutch-internal
    # Zero published host ports: private to internal network only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NODE_ENV: production
      RUNNER_PORT: 5050
      RUNNER_SERVICE_SECRET: ${RUNNER_SERVICE_SECRET:?RUNNER_SERVICE_SECRET must be explicitly set and non-empty in production}
      ENFORCE_CONTAINER_SANDBOX: "true"
      RUNNER_DOCKER_IMAGE: "clutch-sandbox-runner:latest"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  # ============================================================================
  # 3. Backend API & Multiplayer Server (ZERO Docker Socket Mounts)
  # Accessible strictly through reverse proxy (clutch-frontend)
  # ============================================================================
  clutch-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: clutch-api
    restart: unless-stopped
    networks:
      - clutch-internal
      - clutch-frontend
    depends_on:
      postgres:
        condition: service_healthy
      clutch-runner-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://clutch_admin:${DATABASE_PASSWORD:?DATABASE_PASSWORD must be explicitly set in production}@postgres:5432/clutch_db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set to exact production origin}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to strong 32+ char token in production}
      # Microservice boundary: dispatches submissions to internal runner
      RUNNER_SERVICE_URL: http://clutch-runner-service:5050
      RUNNER_SERVICE_SECRET: ${RUNNER_SERVICE_SECRET:?RUNNER_SERVICE_SECRET must be explicitly set in production}
      RUNNER_HTTP_TIMEOUT_MS: 8000
      ENFORCE_CONTAINER_SANDBOX: "true"
    # CRITICAL SECURITY CONTROLS:
    # 1. NO raw Docker socket volume mount:
    #    volumes: - /var/run/docker.sock:/var/run/docker.sock (REMOVED)
    # 2. NO directly published host ports (ports: - "4000:4000" REMOVED)
    #    Access is strictly mediated through the clutch-client reverse proxy on clutch-frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ============================================================================
  # 4. Production Web Client & Reverse Proxy (Nginx)
  # Only service publishing external ports to host (Port 80/443)
  # ============================================================================
  clutch-client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: clutch-client
    restart: unless-stopped
    networks:
      - clutch-frontend
    depends_on:
      - clutch-api
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 20s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
    driver: local
