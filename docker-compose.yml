version: '3.8'

services:
  # ============================================================================
  # 1. Authoritative PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: clutch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clutch_db
      POSTGRES_USER: clutch_admin
      POSTGRES_PASSWORD: clutch_secure_db_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/storage/schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clutch_admin -d clutch_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Dedicated Isolated Code Execution Worker Container
  # Unprivileged user, read-only rootfs, zero network access, strict cgroup caps
  # ============================================================================
  clutch-runner:
    build:
      context: .
      dockerfile: server/Dockerfile.runner
    image: clutch-sandbox-runner:latest
    container_name: clutch-runner
    restart: unless-stopped
    network_mode: none # Strict network isolation: NO inbound or outbound internet
    read_only: true # Read-only root filesystem
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m # Bounded ephemeral write area
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 128M
        reservations:
          memory: 64M

  # ============================================================================
  # 3. Backend API & Real-Time Multiplayer Server
  # ============================================================================
  clutch-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: clutch-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://clutch_admin:clutch_secure_db_password_2026@postgres:5432/clutch_db
      ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173"
      ENFORCE_CONTAINER_SANDBOX: "true" # Enforces strict container isolation in production
      RUNNER_DOCKER_IMAGE: "clutch-sandbox-runner:latest"
    ports:
      - "4000:4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ============================================================================
  # 4. Production Web Client & Reverse Proxy (Nginx)
  # ============================================================================
  clutch-client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: clutch-client
    restart: unless-stopped
    depends_on:
      - clutch-api
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 20s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
    driver: local
