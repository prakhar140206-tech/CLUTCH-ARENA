name: CLUTCH Production Deployment & End-to-End Verification Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Compilation, Unit, Adversarial, Concurrency & Microservice Integrity
  # ----------------------------------------------------------------------------
  local-verification:
    name: Local Build, Concurrency & Microservice Integrity
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          npm --prefix server ci
          npm --prefix client ci

      - name: Production Bundling & TypeScript Verification
        run: |
          npm --prefix server run build
          npm --prefix client run build

      - name: Run Core Test Suite
        working-directory: server
        run: |
          npm test

      - name: Run Concurrency & Data Integrity Suite
        working-directory: server
        run: |
          npx tsx test/concurrencyIntegrityTest.ts

      - name: Run Adversarial Security Suite
        working-directory: server
        run: |
          npx tsx test/adversarialRunnerTest.ts

      - name: Run Hardened Runner Microservice Regression Suite
        working-directory: server
        run: |
          npm run test:microservice

      - name: Run Sandbox Isolation & Security Suite
        working-directory: server
        run: |
          npx tsx test/sandboxSecurityTest.ts

  # ----------------------------------------------------------------------------
  # Job 2: Architecture A Decoupled Microservice & PostgreSQL Deployment Gate
  # ----------------------------------------------------------------------------
  linux-docker-and-postgres-gate:
    name: Linux Docker Isolation & PostgreSQL Deployment Gate
    runs-on: ubuntu-22.04
    needs: local-verification
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dedicated Sandbox Runner Container Image
        run: |
          docker build -t clutch-sandbox-runner:latest -f server/Dockerfile.runner .
          docker image inspect clutch-sandbox-runner:latest --format '{{.Config.User}}'

      - name: Configure Host Docker Socket Permissions (Ephemeral CI Runner)
        run: |
          sudo chmod 666 /var/run/docker.sock

      - name: Generate High-Entropy Ephemeral CI Secrets
        run: |
          DB_PASS=$(openssl rand -hex 16)
          echo "DATABASE_PASSWORD=$DB_PASS" >> $GITHUB_ENV
          echo "DATABASE_URL=postgres://clutch_admin:$DB_PASS@127.0.0.1:5432/clutch_db" >> $GITHUB_ENV
          echo "RUNNER_SERVICE_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "ALLOWED_ORIGINS=https://clutch.arena" >> $GITHUB_ENV

      - name: Launch Hardened Architecture A Microservice Stack
        run: |
          docker compose -f docker-compose.microservice.yml up -d --build

      - name: Wait for PostgreSQL Healthcheck
        run: |
          echo "Waiting for postgres healthcheck..."
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' clutch-postgres 2>/dev/null || echo '"starting"')
            if [ "$STATUS" = '"healthy"' ]; then
              echo "PostgreSQL is healthy!"
              break
            fi
            echo "Waiting for healthy database (status: $STATUS)... ($i/30)"
            sleep 2
          done
          if [ "$STATUS" != '"healthy"' ]; then
            echo "PostgreSQL healthcheck timed out!"
            docker compose -f docker-compose.microservice.yml logs postgres
            exit 1
          fi

      - name: Wait for Runner Microservice Healthcheck
        run: |
          echo "Waiting for clutch-runner-service healthcheck..."
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' clutch-runner-service 2>/dev/null || echo '"starting"')
            if [ "$STATUS" = '"healthy"' ]; then
              echo "Runner microservice is healthy!"
              break
            fi
            echo "Waiting for runner (status: $STATUS)... ($i/30)"
            sleep 2
          done
          if [ "$STATUS" != '"healthy"' ]; then
            echo "Runner microservice healthcheck timed out!"
            docker compose -f docker-compose.microservice.yml logs clutch-runner-service
            exit 1
          fi

      - name: Wait for API & Client Proxy Healthcheck (Port 80)
        run: |
          echo "Waiting for reverse proxy (clutch-client) on port 80..."
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/health || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "CLUTCH Reverse Proxy & API are operational!"
              break
            fi
            echo "Waiting for API (status code: $HTTP_CODE)... ($i/30)"
            sleep 2
          done
          if [ "$HTTP_CODE" != "200" ]; then
            echo "CLUTCH API healthcheck timed out!"
            docker compose -f docker-compose.microservice.yml logs clutch-api
            docker compose -f docker-compose.microservice.yml logs clutch-client
            exit 1
          fi

      - name: Run Authoritative PostgreSQL Migration
        run: |
          docker compose -f docker-compose.microservice.yml exec -T clutch-api node dist/storage/migrateJsonToPostgres.js

      - name: Verify Live Endpoints & Production Readiness
        run: |
          echo "Testing /api/health through reverse proxy..."
          curl -s http://localhost/api/health
          echo -e "\n\nTesting /api/ready..."
          READY_BODY=$(curl -s http://localhost/api/ready)
          echo "Readiness Body: $READY_BODY"
          READY_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/ready)
          echo "Readiness Status Code: $READY_CODE"
          if [ "$READY_CODE" != "200" ]; then
            echo "ERROR: /api/ready returned HTTP $READY_CODE instead of 200!"
            docker compose -f docker-compose.microservice.yml logs clutch-api
            exit 1
          fi
          echo "PASSED: Production endpoints are fully healthy and ready."

      - name: Setup Node.js 22 for Host-based Live Verification
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Test Runner Dependencies
        run: |
          npm --prefix server ci

      - name: Execute Live Infrastructure Verification Suite (Strict CI Mode)
        working-directory: server
        env:
          SERVER_URL: http://localhost
          FAIL_ON_BLOCKED: "true"
        run: |
          npx tsx test/liveInfrastructureGateTest.ts

      - name: Verify Fail-Closed Gate (Stop PostgreSQL & Check 503)
        run: |
          echo "Stopping PostgreSQL to test fail-closed behavior..."
          docker compose -f docker-compose.microservice.yml stop postgres
          sleep 2
          READY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/ready)
          echo "Readiness response code with database stopped: $READY_STATUS"
          if [ "$READY_STATUS" != "503" ]; then
            echo "FAILED: Production API must return 503 when PostgreSQL is down!"
            curl -s http://localhost/api/ready
            exit 1
          fi
          echo "PASSED: Production API strictly failed closed (503)."

      - name: Teardown Services
        if: always()
        run: |
          docker compose -f docker-compose.microservice.yml down -v
